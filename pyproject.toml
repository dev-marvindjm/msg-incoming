[project]
name = "msg-incoming"
version = "0.1.0"
description = "Selective Messaging Ingestor and Router for Telegram (Telethon), Threads, and Webhooks with Multi-Tenant SQLModel and MT5 Dispatcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "telethon>=1.38.0",
    "httpx>=0.27.2",
    "pyjwt>=2.9.0",
    "pwdlib[bcrypt]>=0.2.1",
    "python-multipart>=0.0.12",
    "alembic>=1.13.3",
    "email-validator>=2.3.0",
    "greenlet>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]
