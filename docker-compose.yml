version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. Independent PostgreSQL Database Service
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: msg_incoming_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-msg_incoming_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-msg_incoming_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quant-network

  # ---------------------------------------------------------
  # 2. MSG Incoming Ingestor & Router Microservice
  # ---------------------------------------------------------
  msg-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msg_incoming_ingestor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-msg_incoming_db}
      # Telethon MTProto credentials passed securely via environment variables
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME:-msg_ingestor}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_SESSIONS_DIR: /app/sessions
      TELEGRAM_AUTO_START: ${TELEGRAM_AUTO_START:-true}
      SECRET_KEY: ${SECRET_KEY:-quant-secure-jwt-key-2026}
      BROKER_API_URL: ${BROKER_API_URL:-http://metatrader5-quant-server:8000}
      RUST_APP_URL: ${RUST_APP_URL:-http://rust-app:3000}
    volumes:
      # Persistent volume for Telethon session files (.session)
      - telethon_sessions:/app/sessions
    ports:
      - "8001:8001"
    networks:
      - quant-network

volumes:
  postgres_data:
    name: msg_incoming_postgres_data
  telethon_sessions:
    name: msg_incoming_telethon_sessions

networks:
  quant-network:
    name: quant-network
    driver: bridge
